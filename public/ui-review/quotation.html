<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI review: quotation</title><link rel="stylesheet" href="review.css"></head><body><div class="app-shell" style="display:block"><section class="billing-editor"><header class="billing-page-heading"><div><span class="finance-eyebrow">BILLING</span><h2>New quotation</h2></div><button type="button" class="secondary">Close</button></header><form id="billing-editor-form"><fieldset><section class="billing-customer"><h3>Customer</h3><div class="business-customer-picker"><div class="picker-input"><input role="combobox" aria-expanded="false" aria-label="Search customer name or mobile" aria-controls="«Rha»" placeholder="Customer name or mobile" value=""/><button type="button" class="secondary icon-action" title="New customer" aria-label="New customer">＋</button></div></div><div class="billing-fields"><label>Name<input required="" maxLength="200" value=""/></label><label>Mobile<input type="tel" value=""/></label><label>Email<input type="email" value=""/></label></div></section><section class="billing-fields billing-metadata"><h3 class="billing-section-heading">Bill details</h3><label>Quotation number<input maxLength="80" placeholder="Automatic series if blank" value=""/></label><label>Reference / order number<input maxLength="100" value=""/></label><label>Quotation date<input required="" type="date" value="2026-10-07"/></label><label>Expiry date<input type="date" value=""/></label><label>Payment terms<select><option selected="">Due on receipt</option><option>Net 7</option><option>Net 15</option><option>Net 30</option><option>Net 45</option><option>Net 60</option><option>Due end of the month</option><option>Due end of next month</option><option>Custom</option></select></label><label>Branch<select required=""><option value="branch" selected="">Corporate Office</option></select></label><label>Salesperson<input maxLength="200" value=""/></label><label>Subject<input maxLength="300" value=""/></label><label>Print template<select><option value="" selected="">Company default</option></select></label></section><section class="billing-items"><header><h3>Items <small>1</small></h3><div><button type="button" class="secondary icon-action" title="New service" aria-label="New service">＋</button> <button type="button" class="secondary icon-action" title="Add items in bulk" aria-label="Add items in bulk">▦</button></div></header><div class="billing-item-head"><span>Item &amp; description</span><span>Qty</span><span>Rate</span><span>Amount</span></div><article class="billing-item"><div class="billing-item-row"><label><span class="mobile-label">Description</span><div class="billing-item-name"><div class="service-picker"><input role="combobox" aria-expanded="false" aria-label="Search services" placeholder="Search service…" value=""/></div><button type="button" title="Add description" aria-label="Add description item 1">✎</button></div></label><label><span class="mobile-label">Qty</span><input aria-label="Qty item 1" required="" type="number" min=".01" max="10000" step=".01" value="1"/></label><div class="billing-rate"><input aria-label="Rate item 1" required="" type="number" min="0" max="100000000" step=".01" value="0"/><button type="button" aria-label="Split fees item 1" title="Show government fee and service charge" aria-pressed="false">⇄</button></div><strong>0.00</strong></div><label class="billing-remember"><input type="checkbox" checked=""/>Remember these prices for this branch</label><details><summary>Optional workflow / stages</summary><textarea aria-label="Stages item 1" rows="2" placeholder="One stage per line; leave empty for a simple sale"></textarea><button type="button" class="business-text-button">Use saved stage suggestions</button></details><button type="button" class="business-text-button" disabled="">Remove item</button></article><button type="button" class="secondary">＋ Add row</button></section><section class="billing-bottom"><h3 class="billing-section-heading">Financials</h3><div><details><summary>Notes &amp; terms</summary><label>Customer notes<textarea rows="2" maxLength="2000"></textarea></label><label>Terms &amp; conditions<textarea rows="2" maxLength="2000"></textarea></label><label>Internal notes<textarea rows="2"></textarea></label></details></div><div class="billing-summary"><p><span>Subtotal</span><strong>0.00</strong></p><label>Bill discount<input type="number" min="0" max="100000000" step=".01" value="0"/></label><label>Tax (%)<input type="number" min="0" max="100" step=".01" value="0"/></label><label>Adjustment<input type="number" min="-100000000" max="100000000" step=".01" value="0"/></label><p class="billing-grand"><span>Total</span><strong>0.00</strong></p></div></section></fieldset><p class="billing-attachment-hint">Save a draft to attach private files to this document.</p><footer class="billing-actions"><button type="button" class="secondary">Preview / PDF</button><button type="button" class="secondary">Save draft</button><button type="button" class="primary">Issue quotation</button><button type="button" class="secondary">Save &amp; print</button></footer></form> </section></div></body></html>
